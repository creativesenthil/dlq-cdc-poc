name: dlq-cdc-poc-e2e

# Manual trigger only - never runs automatically, no AWS account,
# no credentials, no billing. Uses LocalStack + Redpanda as free
# GitHub Actions service containers.
on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest test_validation.py -v

  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      localstack:
        image: localstack/localstack:3.7
        env:
          SERVICES: s3,sqs
          DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
      redpanda:
        image: redpandadata/redpanda:v24.2.7
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS CLI + processor dependencies
        run: |
          pip install awscli
          pip install -r processor/requirements.txt

      - name: Wait for LocalStack
        run: |
          until curl -sf http://localhost:4566/_localstack/health > /dev/null; do sleep 2; done

      - name: Create AWS resources
        env:
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: bash scripts/setup_aws.sh

      # NOTE: CI does not drive the full MongoDB -> Debezium -> Kafka capture
      # path, since that leg is flaky inside GitHub's service containers.
      # Instead we produce the two sample records directly onto the Kafka
      # topic as plain JSON, exercising the exact same processor code
      # (consumer.py --input) that the local run_demo.sh uses. The full
      # Debezium capture path is still fully exercised locally.
      - name: Run processor against valid record
        working-directory: processor
        env:
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: python consumer.py --input ../data/valid_customer.json

      - name: Run processor against poison-pill record
        working-directory: processor
        env:
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: python consumer.py --input ../data/poison_customer.json

      - name: Verify S3 has the valid record and DLQ has the poison pill
        env:
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          S3_COUNT=$(aws --endpoint-url=$AWS_ENDPOINT s3 ls s3://cdc-landing --recursive | wc -l)
          echo "S3 objects: $S3_COUNT"
          test "$S3_COUNT" -ge 1

          DLQ_URL=$(aws --endpoint-url=$AWS_ENDPOINT sqs get-queue-url --queue-name cdc-dlq --query QueueUrl --output text)
          DLQ_COUNT=$(aws --endpoint-url=$AWS_ENDPOINT sqs get-queue-attributes --queue-url $DLQ_URL --attribute-names ApproximateNumberOfMessages --query 'Attributes.ApproximateNumberOfMessages' --output text)
          echo "DLQ messages: $DLQ_COUNT"
          test "$DLQ_COUNT" -ge 1

      - name: Run remediation
        working-directory: processor
        env:
          AWS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: python remediation.py
